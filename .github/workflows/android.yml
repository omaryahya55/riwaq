# يبني تطبيق رواق مع كل تعديل، ويرفع ملف APK مع كل إصدار (tag يبدأ بـ v).
# التحديثات تجي من مستودعنا بس (البريف قسم ٢ قرار ٩).
# التوقيع: الأسرار من إعدادات المستودع (Settings → Secrets)، ما تنحفظ في الكود أبداً:
#   RIWAQ_KEYSTORE_B64, RIWAQ_KEYSTORE_PASSWORD, RIWAQ_KEY_ALIAS, RIWAQ_KEY_PASSWORD
name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: فحص سريع لملفات الشاشة
        run: |
          for f in web/js/*.js; do node --check "$f"; done
          # الصفحة تدعم Chrome 87 وفوق (WebHost.MIN_WEBVIEW): ممنوع مزايا أحدث بدون فحص
          ! grep -nE "\?\.|\?\?=|\.at\(|structuredClone|replaceAll\(" web/js/*.js --exclude=quran-meta.js

      - name: تباين النص فوق صور الخلفية
        run: |
          pip install --quiet pillow
          python tools/check-contrast.py

      - name: اختبارات الحسابات (الصلاة، والهجري، والراتب)
        run: node --test tests/logic.test.mjs tests/worker.test.mjs

      - name: مفتاح التوقيع (للإصدارات بس)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RIWAQ_KEYSTORE_B64: ${{ secrets.RIWAQ_KEYSTORE_B64 }}
        run: |
          if [ -n "$RIWAQ_KEYSTORE_B64" ]; then
            echo "$RIWAQ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/riwaq.jks"
            echo "RIWAQ_KEYSTORE=$RUNNER_TEMP/riwaq.jks" >> "$GITHUB_ENV"
          fi

      - name: البناء
        working-directory: android
        env:
          RIWAQ_KEYSTORE_PASSWORD: ${{ secrets.RIWAQ_KEYSTORE_PASSWORD }}
          RIWAQ_KEY_ALIAS: ${{ secrets.RIWAQ_KEY_ALIAS }}
          RIWAQ_KEY_PASSWORD: ${{ secrets.RIWAQ_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      # أسماء ثابتة يدوّر عليها زر التحديث في التطبيق (Update.latest)
      - name: تسمية ملفات الإصدار
        run: |
          mkdir -p dist
          V="${GITHUB_REF_NAME#v}"
          [ "$V" = "$GITHUB_REF_NAME" ] && V=dev
          cp android/app/build/outputs/apk/lite/release/*.apk "dist/riwaq-$V.apk"
          cp android/app/build/outputs/apk/full/release/*.apk "dist/riwaq-full-$V.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: riwaq-apk
          path: dist/*.apk

  # الكتابة في المستودع لهذا الجزء بس، وللإصدارات (tag) بس
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: riwaq-apk
          path: dist
      - name: إصدار على GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.apk
          body_path: CHANGELOG.md
          prerelease: true
