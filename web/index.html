<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>رِواق</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/saver.css">
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <div class="scene" id="scene"></div>
      <section class="screen" id="home"></section>
      <section class="screen" id="saver"></section>
      <div class="dim"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <div id="devbar" class="hidden">
    <button data-a="screen" data-v="home">الواجهة</button>
    <button data-a="screen" data-v="saver">شاشة التوقف</button>
    <span class="sep"></span>
    <button data-a="period" data-v="fajr">فجر</button>
    <button data-a="period" data-v="day">نهار</button>
    <button data-a="period" data-v="asr">عصر</button>
    <button data-a="period" data-v="dusk">مغرب</button>
    <button data-a="period" data-v="night">ليل</button>
    <span class="sep"></span>
    <button data-a="alert">تنبيه الأذان</button>
    <button data-a="night">تعتيم ليلي</button>
    <span class="sep"></span>
    <button data-a="res" data-v="1080">١٠٨٠</button>
    <button data-a="res" data-v="720">٧٢٠</button>
    <button data-a="hide">إخفاء الشريط</button>
  </div>

  <script src="vendor/adhan/adhan.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/format.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/backgrounds.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/teams-ar.js"></script>
  <script src="js/prayer.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/data.js"></script>
  <script src="js/content.js"></script>
  <script src="js/quran-meta.js"></script>
  <script src="js/quran.js"></script>
  <script src="js/saver.js"></script>
  <script src="js/home.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
